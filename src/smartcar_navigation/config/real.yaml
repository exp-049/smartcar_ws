# Initial low-speed hardware envelope; replace only after measured acceptance.
controller_server:
  ros__parameters:
    FollowPath:
      rotate_to_heading_angular_vel: 0.50
      max_angular_accel: 0.75
      vx_max: 0.10
      wz_max: 0.50
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.50
    min_rotational_vel: 0.20
    rotational_acc_lim: 0.75
velocity_smoother:
  ros__parameters:
    max_velocity: [0.10, 0.0, 0.50]
    min_velocity: [-0.05, 0.0, -0.50]
    max_accel: [0.15, 0.0, 0.75]
    max_decel: [-0.35, 0.0, -0.75]
command_guard:
  ros__parameters:
    max_linear_velocity: 0.10
    max_angular_velocity: 0.50
