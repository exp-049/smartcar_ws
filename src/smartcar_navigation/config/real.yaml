# Measured hardware envelope for the real chassis.
#
# The drive motors only start above a ~55% duty deadzone. The chassis now runs
# open loop: command_guard converts physical velocity to normalized wheel PWM
# using one speed_per_pwm value; firmware applies signed ReLU from start duty
# to the configured maximum. The left encoder remains single phase, so it is
# not used for speed feedback.
#
# Keep the controller able to sample from rest; velocity_smoother bounds must
# include zero. The firmware handles the motor deadzone in its PWM mapping.
controller_server:
  ros__parameters:
    FollowPath:
      # The wheel odometry velocity is uncalibrated; use MPPI's command estimate.
      open_loop: true
      # Give the chassis enough wheel command to break static friction while turning.
      rotate_to_heading_angular_vel: 0.80
      max_angular_accel: 1.20
      vx_max: 0.10
      vx_min: 0.0
      wz_max: 0.80
      # Bias sampling toward the cruise band so the optimizer prefers moving
      # briskly through the deadzone instead of creeping at its lower edge.
      vx_std: 0.08
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.80
    min_rotational_vel: 0.35
    rotational_acc_lim: 1.20
velocity_smoother:
  ros__parameters:
    max_velocity: [0.10, 0.0, 0.80]
    min_velocity: [-0.10, 0.0, -0.80]
    max_accel: [0.25, 0.0, 1.20]
    max_decel: [-0.25, 0.0, -1.20]
command_guard:
  ros__parameters:
    output_topic: /car/chassis/cmd_pwm
    direct_input_topic: /car/chassis/cmd_vel
    max_linear_velocity: 0.10
    max_angular_velocity: 0.80
    normalized_output: true
    invert_linear: true
    invert_angular: false
    # Wheel speed in m/s represented by normalized PWM magnitude 1.0.
    speed_per_pwm: 0.2916666667
    wheel_separation: 0.133
