bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /car/chassis/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: nav2_bt_navigator::NavigateToPoseNavigator}
    navigate_through_poses: {plugin: nav2_bt_navigator::NavigateThroughPosesNavigator}
    # navigation.launch.py supplies behavior_trees/stable_detour.xml.
    # Keep a valid detour; check the upcoming path at 2 Hz and replan if blocked.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    enable_stamped_cmd_vel: false
    odom_topic: /car/chassis/odom
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker: {plugin: nav2_controller::SimpleProgressChecker, required_movement_radius: 0.08, movement_time_allowance: 15.0}
    general_goal_checker: {plugin: nav2_controller::SimpleGoalChecker, stateful: false, xy_goal_tolerance: 0.08, yaw_goal_tolerance: 0.18}
    FollowPath:
      # Rotate toward the start of the global path before handing off to MPPI.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_mppi_controller::MPPIController
      angular_dist_threshold: 0.60
      angular_disengage_threshold: 0.20
      forward_sampling_distance: 0.30
      rotate_to_heading_angular_vel: 0.60
      max_angular_accel: 1.50
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      position_checker: {stateful: false}
      rotate_to_heading_once: false
      closed_loop: false
      time_steps: 56
      model_dt: 0.05
      # Keep the final command caps in velocity_smoother, while giving the
      # optimizer enough authority to leave its zero-speed initial sequence.
      # Publish the selected path and sampled candidate trajectories for RViz.
      visualize: true
      batch_size: 1000
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.0
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.40
      vx_max: 0.20
      vx_min: -0.05
      vy_max: 0.0
      wz_max: 1.20
      iteration_count: 1
      prune_distance: 1.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      regenerate_noises: true
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      # Jazzy evaluates these thresholds against Euclidean goal distance.
      # Large defaults (1.4 m) disable path following even when a nearby goal
      # is across a wall and the safe detour is several metres long.
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.20}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.06}
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.05}
      CostCritic: {enabled: true, cost_power: 1, cost_weight: 3.81, near_collision_cost: 253, critical_cost: 300.0, consider_footprint: false, collision_cost: 1000000.0, near_goal_distance: 0.20, trajectory_point_step: 2}
      PathAlignCritic: {enabled: true, cost_power: 1, cost_weight: 14.0, max_path_occupancy_ratio: 0.05, trajectory_point_step: 4, threshold_to_consider: 0.05, offset_from_furthest: 20, use_path_orientations: false}
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5, threshold_to_consider: 0.05}
      PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 2.0, offset_from_furthest: 4, threshold_to_consider: 0.05, max_angle_to_furthest: 1.0, mode: 0}

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      # Reach the requested goal cell instead of substituting a nearby goal
      # across the position tolerance. Occupied goals must fail explicitly.
      tolerance: 0.0
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      smooth_path: true
      # Strongly prefer free space when several paths are available.  Cells
      # classified as lethal below are never traversed.
      cost_travel_multiplier: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.13
      resolution: 0.025
      # Keep a rolling planning window so a goal is not rejected merely
      # because it is outside the finite raster currently published by the
      # map server.  Unknown cells remain available to Smac when requested.
      rolling_window: true
      width: 20
      height: 20
      track_unknown_space: true
      # StaticLayer reads these map interpretation parameters from the
      # global costmap namespace (not the plugin namespace).
      # A probability near 50 is uncertain, including visibility frontiers;
      # do not turn those frontiers into false walls. Confident occupied map
      # cells are lethal; live lidar marks new obstacles immediately too.
      lethal_cost_threshold: 65
      # Known non-obstacle probabilities must become FREE (0). Keeping their
      # scaled probabilities (5..248) would make unknown cost 5 cheaper and
      # cause unnecessary exploration detours.
      trinary_costmap: true
      unknown_cost_value: -1
      always_send_full_costmap: true
      plugins: [static_layer, obstacle_layer, inflation_layer, familiarity_layer]
      # Smac travel multiplier 5 gives 1 + 5*5/252 = ~1.10 per unknown cell.
      # Run last: preserve every known obstacle/inflation cost, replace only 255.
      familiarity_layer:
        plugin: smartcar_costmap_plugins::UnknownCostLayer
        enabled: true
        unknown_cost: 5
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        # inf marks "no return within max_range", i.e. unknown, not free. With
        # inf_is_valid the layer treats inf as a return at raytrace_max_range and
        # fences the costmap with phantom obstacles at 8 m; disable it so blind
        # directions stay unknown instead of being marked or cleared.
        scan: {topic: /car/scan, data_type: LaserScan, clearing: true, marking: true, min_obstacle_height: -0.10, max_obstacle_height: 0.50, raytrace_max_range: 8.0, raytrace_min_range: 0.12, obstacle_max_range: 5.0, obstacle_min_range: 0.12, inf_is_valid: false}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, cost_scaling_factor: 5.0, inflation_radius: 0.26}

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: chassis_odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.025
      robot_radius: 0.13
      # The global map keeps unknown cells for Smac's allow_unknown policy.
      # The rolling local window is populated from the live scan; treating its
      # unobserved cells as lethal would prevent MPPI from entering newly seen
      # space while mapping.
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /car/scan, data_type: LaserScan, clearing: true, marking: true, min_obstacle_height: -0.10, max_obstacle_height: 0.50, raytrace_max_range: 8.0, raytrace_min_range: 0.12, obstacle_max_range: 3.0, obstacle_min_range: 0.12, inf_is_valid: false}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, cost_scaling_factor: 5.0, inflation_radius: 0.26}

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    drive_on_heading: {plugin: nav2_behaviors::DriveOnHeading}
    wait: {plugin: nav2_behaviors::Wait}
    local_frame: chassis_odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.25
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 50.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.20, 0.0, 1.20]
    min_velocity: [-0.05, 0.0, -1.20]
    max_accel: [0.25, 0.0, 1.5]
    max_decel: [-0.35, 0.0, -1.5]
    odom_topic: /car/chassis/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: chassis_odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /car/cmd_vel_checked
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    # The UDP lidar anchors its own clock to the host, and that anchor drifts:
    # measured source-vs-node skew grows past 0.5 s within seconds, which made
    # collision_monitor discard every scan and hold the robot in STOP. Keep the
    # timeout wide enough to ride out the skew until the HAL clock is fixed.
    source_timeout: 3.0
    stop_pub_timeout: 0.5
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint, time_before_collision: 1.2, simulation_time_step: 0.1, min_points: 6, visualize: false, enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: /car/scan, min_height: 0.0, max_height: 0.25, enabled: true}

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: nav2_smoother::SimpleSmoother, tolerance: 1.0e-10, max_its: 1000, do_refinement: true}

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: nav2_waypoint_follower::WaitAtWaypoint, enabled: true, waypoint_pause_duration: 0}

# Sole publisher of the public chassis command, shared by sim and real.
command_guard:
  ros__parameters:
    use_sim_time: true
    input_topic: /car/cmd_vel_checked
    output_topic: /car/chassis/cmd_vel
    # Command lease only; no sensor/TF health gating in this node.
    timeout_sec: 5.0
    max_linear_velocity: 0.20
    max_angular_velocity: 1.20
    normalized_output: false
    # Wheel speed in m/s represented by normalized PWM magnitude 1.0.
    speed_per_pwm: 0.35
    wheel_separation: 0.133
