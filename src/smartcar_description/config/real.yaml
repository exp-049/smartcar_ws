# Measured installation for the physical chassis.
# base_link is the wheel-axle midpoint projected to the ground; every xyz below
# is expressed in base_link, so z is height above the ground.
metadata:
  robot_id: car01
  calibration_version: measured-2026-10-28
  status: measured
  measurement_method: manual tape measurement from base_link origin
  source_data: operator measurement 2026-10-28
# Physical geometry only. Effective odometry parameters belong to chassis firmware.
model:
  wheel_radius: 0.024
  wheel_separation: 0.133
  wheel_width: 0.018
  footprint_radius: 0.13
  body_length: 0.180
  body_width: 0.110
  body_height: 0.020
  body_mass: 0.80
  body_z: 0.045
  inertia_xx: 0.000845
  inertia_yy: 0.002200
  inertia_zz: 0.002951
  caster_clearance: 0.0005
  chassis_xyz: "0 0 0"
  chassis_rpy: "0 0 0"
  laser_xyz: "0.06 0 0.125"
  laser_rpy: "0 0 0"
  imu_xyz: "0.053 -0.048 0.076"
  imu_rpy: "0 0 0"
calibration_ownership:
  installation_extrinsics: robot_state_publisher
  effective_wheel_geometry_and_encoder_conversion: chassis_firmware
  imu_bias_scale_and_axis_conversion: esp32_s3_imu_module
# Provenance only: not applied again by the ROS model or HAL template.
device_calibration:
  chassis_firmware_version: "0.4.0"
  chassis_calibration_version: measured-2026-10-28
  imu_firmware_version: esp32_s3_imu_module-unknown
  imu_calibration_version: uncalibrated-bias
